services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: optometry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: optometry
    volumes:
      - optometry_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optometry -d optometry"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://optometry:${POSTGRES_PASSWORD}@db:5432/optometry
    command: ["node", "src/migrate.js"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment:
      DATABASE_URL: postgres://optometry:${POSTGRES_PASSWORD}@db:5432/optometry
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  optometry_pg:
